name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包 zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path src, scripts, themes, docs, Start.bat, README.md, LICENSE, SKILL.md `
            -DestinationPath "workbuddy-skins-$tag.zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: workbuddy-skins-${{ github.ref_name }}.zip
          generate_release_notes: true
